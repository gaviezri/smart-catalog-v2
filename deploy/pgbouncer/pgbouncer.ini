[databases]
; Write pool → HAProxy primary port
smart_catalog = host=haproxy port=5432 dbname=smart_catalog

; Read pool → HAProxy replica port
smart_catalog_replica = host=haproxy port=5433 dbname=smart_catalog

[pgbouncer]
; --- Connection Settings ---
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; --- Pooling Strategy ---
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20

; --- Timeouts & Safety ---
query_timeout = 30
server_idle_timeout = 600

; --- Monitoring ---
admin_users = admin
stats_period = 60
ignore_startup_parameters = extra_float_digits
