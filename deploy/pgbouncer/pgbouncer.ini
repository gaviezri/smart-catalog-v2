[databases]
# Points to HAProxy's Primary (Write) Port
primary_db = host=haproxy port=5432 dbname=catalog_db

# Points to HAProxy's Replica (Read) Port
replica_db = host=haproxy port=5433 dbname=catalog_db

[pgbouncer]
# --- Connection Settings ---
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# --- Pooling Strategy ---
# 'transaction' mode allows PgBouncer to reuse connections 
# immediately after a statement finishes.
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20

# --- Timeouts & Safety ---
# Similarity searches on 100M rows can be heavy; 
# we set a 30s ceiling to prevent pool exhaustion.
query_timeout = 30s
server_idle_timeout = 600

# --- Monitoring ---
admin_users = admin
stats_period = 60
