# deploy/postgres/patroni.yml
# Shared Patroni configuration for all cluster nodes.
# Node-specific values (name, connect_address) come from
# PATRONI_* environment variables set in docker-compose.yml.

scope: smartcatalog

restapi:
  listen: 0.0.0.0:8008

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /home/postgres/pgdata
  bin_dir: /usr/lib/postgresql/17/bin
  pgpass: /tmp/pgpass0
  authentication:
    replication:
      username: replicator
      password: repl_password
    superuser:
      username: postgres
      password: postgres

  parameters:
    max_connections: 200
    shared_buffers: 256MB
    work_mem: 16MB
    maintenance_work_mem: 512MB
    max_wal_size: 2GB
    min_wal_size: 256MB
    max_parallel_maintenance_workers: 4
    max_parallel_workers: 4

  pg_hba:
    - local   all  all                trust
    - host    all  all  0.0.0.0/0     md5
    - host    replication  replicator  0.0.0.0/0  md5

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true

  initdb:
    - encoding: UTF8
    - data-checksums

  post_bootstrap: /docker-entrypoint-initdb.d/post-bootstrap.sh

etcd3:
  hosts: etcd:2379
