global
    maxconn 2000

defaults
    log global
    mode tcp                  # Database traffic is raw TCP
    retries 3
    timeout connect 5s
    timeout client 30m        # Long timeouts for DB sessions
    timeout server 30m
    timeout check 2s          # Rapid health checks

# ── Monitoring Dashboard ────────────────────────────────────────────────────
listen stats
    bind *:1936
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:password  # Change in production!

# ── Write Port (Primary) ───────────────────────────────────────────────────
frontend ft_postgresql_write
    bind *:5432
    default_backend bk_db_primary

# ── Read Port (Replicas) ───────────────────────────────────────────────────
frontend ft_postgresql_read
    bind *:5433
    default_backend bk_db_replicas

# ── Backends ────────────────────────────────────────────────────────────────

backend bk_db_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    server patroni-1 patroni-1:5432 check port 8008
    server patroni-2 patroni-2:5432 check port 8008

backend bk_db_replicas
    balance roundrobin
    option httpchk GET /read-only
    http-check expect status 200
    default-server inter 3s fall 3 rise 2

    server patroni-1 patroni-1:5432 check port 8008
    server patroni-2 patroni-2:5432 check port 8008
