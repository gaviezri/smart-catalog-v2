global
    maxconn 2000
    # Run in a chroot jail for security
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp                  # Database traffic is raw TCP
    retries 3
    timeout connect 5s
    timeout client 30m        # Long timeouts for DB sessions
    timeout server 30m
    timeout check 2s          # Rapid health checks

# 1. Monitoring Dashboard (Crucial for Debugging)
listen stats
    bind *:1936
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:password # Change this!

# 2. The Write Port (Primary)
frontend ft_postgresql_write
    bind *:5432
    default_backend bk_db_primary

# 3. The Read Port (Replicas)
frontend ft_postgresql_read
    bind *:5433
    default_backend bk_db_replicas

# --- Backends ---

backend bk_db_primary
    balance roundrobin
    option httpchk GET /primary
    # 'on-marked-down shutdown-sessions' kicks off old clients if a failover occurs
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    
    server db1 db1:5432 check port 8008
    server db2 db2:5432 check port 8008
    server db3 db3:5432 check port 8008

backend bk_db_replicas
    balance source             # Sticky sessions for read consistency
    option httpchk GET /replica
    default-server inter 3s fall 3 rise 2
    
    server db1 db1:5432 check port 8008
    server db2 db2:5432 check port 8008
    server db3 db3:5432 check port 8008
    
    # Backup: If all replicas are down, send read traffic to the primary
    server db_primary_backup db1:5432 backup check port 8008
