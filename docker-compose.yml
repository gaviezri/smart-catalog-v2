# ─────────────────────────────────────────────────────────────────────────────
# Smart Catalog V2 — Docker Compose
#
# Simple mode:  docker compose --profile dev up --build
#   → single Postgres + backend + frontend
#
# Full HA mode: docker compose --profile production up --build
#   → Patroni cluster + HAProxy + PgBouncer + backend + frontend
# ─────────────────────────────────────────────────────────────────────────────

# ── Shared backend config ───────────────────────────────────────────────────
x-backend: &backend-base
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
  ports:
    - "8000:8000"
  environment: &backend-env
    DJANGO_SECRET_KEY: dev-secret-change-in-prod
    DB_NAME: smart_catalog
    DB_USER: postgres
    DB_PASSWORD: postgres
    GUNICORN_WORKERS: "2"
    CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8000,http://frontend:80"

services:

  # ═══════════════════════════════════════════════════════════════════════════
  #  SIMPLE MODE  (--profile dev)
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    profiles: [ "dev" ]
    image: timescale/timescaledb-ha:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smart_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-dev:
    <<: *backend-base
    profiles: [ "dev" ]
    networks:
      default:
        aliases:
          - backend
    environment:
      <<: *backend-env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_REPLICA_HOST: postgres
      DB_REPLICA_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════════
  #  HA MODE  (--profile production)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── etcd — Distributed consensus for Patroni ─────────────────────────────
  etcd:
    profiles: [ "production" ]
    image: quay.io/coreos/etcd:v3.5.17
    environment:
      ETCD_NAME: etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: smartcatalog-etcd
      ETCDCTL_API: "3"
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Patroni node 1 (primary candidate) ───────────────────────────────────
  patroni-1:
    profiles: [ "production" ]
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile.patroni
    hostname: patroni-1
    environment: &patroni-env
      PATRONI_SCOPE: smartcatalog
      PATRONI_RESTAPI_LISTEN: "0.0.0.0:8008"
      PATRONI_POSTGRESQL_LISTEN: "0.0.0.0:5432"
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/pgdata
      PATRONI_ETCD3_HOSTS: "'etcd:2379'"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: postgres
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: repl_password
      PATRONI_POSTGRESQL_PARAMETERS_max_connections: "200"
      PATRONI_POSTGRESQL_PARAMETERS_shared_buffers: "256MB"
      PATRONI_POSTGRESQL_PARAMETERS_work_mem: "16MB"
      # Node-specific
      PATRONI_NAME: patroni-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: "patroni-1:8008"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "patroni-1:5432"
    volumes:
      - patroni1_data:/home/postgres/pgdata
      - ./deploy/postgres/patroni.yml:/home/postgres/patroni.yml:ro
      - ./deploy/postgres/post-bootstrap.sh:/docker-entrypoint-initdb.d/post-bootstrap.sh
      - ./deploy/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    depends_on:
      etcd:
        condition: service_healthy

  # ── Patroni node 2 (replica candidate) ───────────────────────────────────
  patroni-2:
    profiles: [ "production" ]
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile.patroni
    hostname: patroni-2
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: "patroni-2:8008"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "patroni-2:5432"
    volumes:
      - patroni2_data:/home/postgres/pgdata
      - ./deploy/postgres/patroni.yml:/home/postgres/patroni.yml:ro
      - ./deploy/postgres/post-bootstrap.sh:/docker-entrypoint-initdb.d/post-bootstrap.sh
      - ./deploy/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    depends_on:
      etcd:
        condition: service_healthy

  # ── HAProxy — read/write split ───────────────────────────────────────────
  haproxy:
    profiles: [ "production" ]
    image: haproxy:lts
    ports:
      - "1936:1936" # stats dashboard
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - patroni-1
      - patroni-2

  # ── PgBouncer — connection pooling ───────────────────────────────────────
  pgbouncer:
    profiles: [ "production" ]
    image: edoburu/pgbouncer:latest
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./deploy/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      - haproxy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U postgres || true" ]
      interval: 5s
      timeout: 3s
      retries: 15

  # ── Backend (HA mode) ────────────────────────────────────────────────────
  backend-production:
    <<: *backend-base
    profiles: [ "production" ]
    networks:
      default:
        aliases:
          - backend
    environment:
      <<: *backend-env
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_REPLICA_HOST: pgbouncer
      DB_REPLICA_PORT: "6432"
      DB_REPLICA_NAME: smart_catalog_replica
    depends_on:
      pgbouncer:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════════
  #  FRONTEND (both modes)
  # ═══════════════════════════════════════════════════════════════════════════

  frontend-dev:
    profiles: [ "dev" ]
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend-dev

  frontend-production:
    profiles: [ "production" ]
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend-production

volumes:
  pg_data:
  patroni1_data:
  patroni2_data:
